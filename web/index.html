<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ocklu Pemetaan Pemilih — Command Center</title>
<style>
:root{--bg:#0a0e14;--pnl:#111823;--pnl2:#161f2e;--ln:#22304a;--tx:#e6edf7;--mut:#8296b3;
--ok:#22c55e;--wr:#f59e0b;--bd:#ef4444;--ac:#38bdf8;--ac2:#a78bfa}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);
font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#0d1420,#0a0e14);border-bottom:1px solid var(--ln);padding:10px 16px}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;letter-spacing:.5px;font-size:15px;cursor:pointer}.logo span{color:var(--ac)}
.pill{font-size:11px;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);color:var(--mut);cursor:pointer}
.pill:hover{border-color:var(--ac);color:var(--ac)}
.pill.sim{border-color:var(--wr);color:var(--wr);background:#f59e0b14}
.pill.live{border-color:var(--ok);color:var(--ok);background:#22c55e14}
nav{display:flex;gap:2px;flex-wrap:wrap;margin-top:9px}
nav button{background:transparent;border:1px solid transparent;color:var(--mut);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:600}
nav button:hover{color:var(--tx);background:#ffffff08}
nav button.on{background:var(--pnl2);color:var(--ac);border-color:var(--ln)}
main{padding:16px;max-width:1560px;margin:0 auto}
.warn{background:#f59e0b12;border:1px solid #f59e0b44;border-left:3px solid var(--wr);padding:9px 12px;border-radius:8px;margin-bottom:14px;font-size:12px}
.warn b{color:var(--wr)}.warn ul{margin:6px 0 0;padding-left:18px;color:var(--mut)}
.warn li{cursor:pointer}.warn li:hover{color:var(--tx);text-decoration:underline}
.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g2{grid-template-columns:repeat(2,1fr)}.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2.4fr}
@media(max-width:1100px){.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr 1fr}}
@media(max-width:680px){.g4,.g3,.g2,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--pnl);border:1px solid var(--ln);border-radius:12px;padding:14px}
.card h3{margin:0 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.8px;color:var(--mut);font-weight:700}
.klik{cursor:pointer;transition:border-color .12s,transform .12s}
.klik:hover{border-color:var(--ac);transform:translateY(-1px)}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}
.kpi .s{font-size:11px;color:var(--mut);margin-top:3px}
.kpi .go{font-size:10px;color:var(--ac);margin-top:6px;opacity:.001}
.klik:hover .go{opacity:1}
.up{color:var(--ok)}.dn{color:var(--bd)}.wrn{color:var(--wr)}.ac{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;color:var(--mut);font-weight:600;padding:7px 8px;border-bottom:1px solid var(--ln);cursor:pointer;white-space:nowrap;position:sticky;top:0;background:var(--pnl);z-index:2}
th:hover{color:var(--ac)}td{padding:6px 8px;border-bottom:1px solid #ffffff08;white-space:nowrap}
tr.klik:hover td{background:#38bdf812}
.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:6px;background:#ffffff12;border-radius:4px;overflow:hidden;min-width:56px;cursor:pointer}
.bar i{display:block;height:100%;border-radius:4px}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:700;letter-spacing:.3px;cursor:pointer}
.tag:hover{outline:1px solid currentColor}
.z0{background:#22c55e22;color:#4ade80}.z1{background:#ef444422;color:#f87171}
.z2{background:#38bdf822;color:#7dd3fc}.z3{background:#8296b322;color:#8296b3}
canvas{display:block;width:100%;border-radius:10px;background:#070b11;cursor:crosshair}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mut);margin-top:8px}
.legend span{cursor:pointer}.legend span:hover{color:var(--ac)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:-1px}
select,input,textarea{background:var(--pnl2);border:1px solid var(--ln);color:var(--tx);border-radius:7px;padding:5px 8px;font-size:12px;font-family:inherit}
input[type=range]{padding:0;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.tip{position:fixed;pointer-events:none;background:#0f1826f2;border:1px solid var(--ln);border-radius:8px;padding:8px 10px;font-size:11px;z-index:80;display:none;box-shadow:0 8px 24px #0008;max-width:270px}
.row{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #ffffff08}
.row:last-child{border:0}.row b{font-variant-numeric:tabular-nums}
.row.klik:hover{background:#38bdf80f}
.sub{color:var(--mut);font-size:11px}
.gauge{position:relative;height:8px;background:#ffffff12;border-radius:5px;margin:8px 0 4px}
.gauge i{position:absolute;height:100%;border-radius:5px;background:linear-gradient(90deg,#ef4444,#f59e0b,#22c55e)}
.gauge u{position:absolute;top:-4px;width:2px;height:16px;background:#fff;opacity:.7}
.scroll{max-height:560px;overflow:auto}
.hide{display:none}
.mini{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.45}
.w{color:var(--ac);cursor:pointer;border-bottom:1px dotted #38bdf866}
.w:hover{color:#7dd3fc}
button.act{background:var(--ac);color:#04121c;border:0;padding:7px 12px;border-radius:7px;font-weight:700;cursor:pointer;font-size:12px}
button.act:hover{background:#7dd3fc}
button.gh{background:transparent;border:1px solid var(--ln);color:var(--tx);padding:6px 11px;border-radius:7px;cursor:pointer;font-size:12px}
button.gh:hover{border-color:var(--ac);color:var(--ac)}
button.dgr{background:#ef444418;border:1px solid #ef444455;color:#f87171;border-radius:6px;cursor:pointer;padding:2px 8px;font-size:11px}
.ovl{position:fixed;inset:0;background:#04070cd9;z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto}
.mdl{background:var(--pnl);border:1px solid var(--ln);border-radius:14px;max-width:1080px;width:100%;padding:16px;box-shadow:0 24px 60px #000a}
.mdl h2{margin:0 0 4px;font-size:17px}
.mdlx{float:right;cursor:pointer;color:var(--mut);font-size:20px;line-height:1}
.mdlx:hover{color:var(--bd)}
.stab{display:flex;gap:4px;flex-wrap:wrap;margin:12px 0}
.stab button{background:var(--pnl2);border:1px solid var(--ln);color:var(--mut);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;font-weight:600}
.stab button.on{color:var(--ac);border-color:var(--ac)}
.toast{position:fixed;right:16px;bottom:16px;background:var(--pnl2);border:1px solid var(--ok);color:var(--tx);
padding:10px 14px;border-radius:10px;z-index:90;font-size:12px;box-shadow:0 8px 24px #0008;display:none}
.toast.err{border-color:var(--bd)}
.gridin td{padding:3px 4px}.gridin input{width:100%;min-width:70px}
.chip{display:inline-block;background:var(--pnl2);border:1px solid var(--ln);border-radius:99px;padding:2px 9px;font-size:11px;margin:0 4px 4px 0;cursor:pointer}
.chip.on{border-color:var(--ac);color:var(--ac)}
.drop{border:1px dashed var(--ln);border-radius:10px;padding:14px;text-align:center;color:var(--mut);cursor:pointer}
.drop:hover,.drop.hot{border-color:var(--ac);color:var(--ac)}
@media print{header,nav,.noprint{display:none}body{background:#fff;color:#000}.card{border-color:#ccc;background:#fff}}
</style></head><body>
<header><div class="hd">
  <div class="logo" onclick="go('ringkas')">OCKLU <span>PEMETAAN PEMILIH</span></div>
  <span class="pill" id="pWil" onclick="go('konfig')"></span>
  <span class="pill" id="pHari" onclick="go('konfig')"></span>
  <span class="pill" id="pSum" onclick="go('konfig')"></span>
  <span class="pill" id="pLengkap" onclick="go('data')"></span>
  <span style="flex:1"></span>
  <button class="gh noprint" onclick="hitungUlang()">Hitung ulang</button>
  <button class="gh noprint" onclick="window.print()">Cetak</button>
</div><nav id="nav"></nav></header>
<main>
<div class="warn" id="warn"></div>
<section id="v-ringkas"></section><section id="v-peta" class="hide"></section>
<section id="v-wilayah" class="hide"></section><section id="v-target" class="hide"></section>
<section id="v-kursi" class="hide"></section><section id="v-drone" class="hide"></section>
<section id="v-saksi" class="hide"></section><section id="v-isu" class="hide"></section>
<section id="v-anggaran" class="hide"></section><section id="v-simulasi" class="hide"></section>
<section id="v-data" class="hide"></section><section id="v-konfig" class="hide"></section>
</main>
<div class="tip" id="tip"></div><div class="toast" id="toast"></div><div id="ovl"></div>
<script>
const TAB=[['ringkas','Ringkas'],['peta','Peta & Drone'],['wilayah','Wilayah'],['target','Target & Gap'],
['kursi','Kursi (Sainte-Laguë)'],['drone','Sistem Drone'],['saksi','Saksi TPS'],['isu','Isu'],
['anggaran','Anggaran'],['simulasi','Simulasi'],['data','Input Data'],['konfig','Konfigurasi']];
let D=null,SEL=null,SORT={k:'dpt',d:-1},LAYER='ikc',AKTIF='ringkas',
    FILTER={zona:null,dapil:null,isu:null,cari:''},EDIT={},KONF=null,BERKAS=null;
const n0=v=>v==null||isNaN(v)?'—':Math.round(v).toLocaleString('id-ID');
const n1=v=>v==null||isNaN(v)?'—':(+v).toLocaleString('id-ID',{maximumFractionDigits:1});
const pc=v=>v==null||isNaN(v)?'—':(v*100).toFixed(1)+'%';
const pp=v=>v==null||isNaN(v)?'—':(+v).toFixed(1)+'%';
const rp=v=>v==null||isNaN(v)?'—':'Rp '+Math.round(v).toLocaleString('id-ID');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const erf=x=>{const s=x<0?-1:1;x=Math.abs(x);const t=1/(1+0.3275911*x);
 return s*(1-((((1.061405429*t-1.453152027)*t+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x))};
const cdf=z=>0.5*(1+erf(z/Math.SQRT2));
const zcls=z=>!z?'z3':z.startsWith('BASIS')?'z0':z.startsWith('GARAP')?'z1':z.startsWith('AMANKAN')?'z2':'z3';
const warna=v=>{v=Math.max(0,Math.min(1,v||0));const a=[239,68,68],b=[245,158,11],c=[34,197,94];
 const m=v<.5?a.map((x,i)=>x+(b[i]-x)*v*2):b.map((x,i)=>x+(c[i]-x)*(v-.5)*2);
 return'rgb('+m.map(Math.round).join(',')+')'};
const K=()=>D.konfigurasi.kandidat_kita;
const wil=k=>D.wilayah.find(w=>w.kode===k);
function toast(m,err){const t=document.getElementById('toast');t.textContent=m;t.className='toast'+(err?' err':'');
 t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)}
function tip(e,html){const t=document.getElementById('tip');if(!html){t.style.display='none';return}
 t.innerHTML=html;t.style.display='block';t.style.left=Math.min(innerWidth-280,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'}
function go(k,opt){AKTIF=k;if(opt&&opt.filter)Object.assign(FILTER,opt.filter);
 TAB.forEach(([t])=>document.getElementById('v-'+t).classList.toggle('hide',t!==k));
 [...document.querySelectorAll('#nav button')].forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 if(k==='wilayah')vWilayah();if(k==='data')vData();if(k==='konfig')vKonfig();
 if(k==='peta'||k==='drone'||k==='ringkas')requestAnimationFrame(peta);scrollTo(0,0)}
const api=async(u,body)=>{const r=await fetch(u,body?{method:'POST',headers:{'Content-Type':'application/json'},
 body:JSON.stringify(body)}:undefined);return r.json()};
async function muat(){D=await api('data.json?'+Date.now());render()}
async function hitungUlang(){const r=await api('/api/hitung');await muat();
 toast(r.ok?'Hitung ulang selesai':'Gagal hitung: '+(r.galat||'').slice(0,90),!r.ok)}
function modal(judul,isi,lebar){document.getElementById('ovl').innerHTML=
 '<div class="ovl" onclick="if(event.target===this)tutup()"><div class="mdl" style="max-width:'+(lebar||1080)+'px">'+
 '<span class="mdlx" onclick="tutup()">×</span><h2>'+judul+'</h2><div id="mdlIsi">'+isi+'</div></div></div>'}
function tutup(){document.getElementById('ovl').innerHTML=''}
addEventListener('keydown',e=>{if(e.key==='Escape')tutup()});
muat();

/* ================= RENDER UTAMA ================= */
function render(){const m=D.meta;
 document.getElementById('nav').innerHTML=TAB.map(([k,l])=>'<button data-k="'+k+'" onclick="go(\''+k+'\')" class="'+(k===AKTIF?'on':'')+'">'+l+'</button>').join('');
 document.getElementById('pWil').textContent=m.wilayah_kerja;
 document.getElementById('pHari').textContent=m.hari_menuju+' hari menuju '+m.tanggal_pemungutan;
 const ps=document.getElementById('pSum');ps.textContent=m.sumber_data==='contoh'?'DATA SIMULASI':'DATA RESMI';
 ps.className='pill '+(m.sumber_data==='contoh'?'sim':'live');
 document.getElementById('pLengkap').textContent='kelengkapan data '+pc(m.kelengkapan_data);
 document.getElementById('warn').innerHTML='<b>Pagar data — klik untuk memperbaiki</b><ul>'+
  m.peringatan.map((p,i)=>'<li onclick="perbaiki('+i+')">'+esc(p)+'</li>').join('')+'</ul>';
 vRingkas();vPeta();vWilayah();vTarget();vKursi();vDrone();vSaksi();vIsu();vAnggaran();vSimulasi();(window.EXTRA||[]).forEach(f=>{try{f()}catch(e){console.warn('EXTRA',e)}});
 TAB.forEach(([t])=>document.getElementById('v-'+t).classList.toggle('hide',t!==AKTIF));
 [...document.querySelectorAll('#nav button')].forEach(b=>b.classList.toggle('on',b.dataset.k===AKTIF));
 requestAnimationFrame(peta)}
function perbaiki(i){const p=D.meta.peringatan[i];
 if(/SUMBER DATA/i.test(p))return go('konfig');
 if(/tanpa survei/i.test(p))return bukaTabel('survei.csv');
 if(/relawan/i.test(p))return bukaTabel('relawan.csv');
 if(/tokoh/i.test(p))return modal('Komponen tokoh',
  '<p>Belum ada berkas pendukung tokoh, jadi bobotnya dinormalkan ke komponen lain — tidak ditebak.</p>'+
  '<p class="sub">Untuk mengaktifkannya: buat <code>data/tokoh.csv</code> berisi kode_wilayah, nama tokoh, jangkauan, dan skor dukungan, lalu beri tahu agar mesin membacanya.</p>');
 if(/Kelengkapan data/i.test(p))return go('data');
 go('data')}
const kpi=(t,v,s,c,aksi)=>'<div class="card kpi'+(aksi?' klik':'')+'"'+(aksi?' onclick="'+aksi+'"':'')+'><h3>'+t+'</h3>'+
 '<div class="v '+(c||'')+'">'+v+'</div><div class="s">'+(s||'')+'</div>'+(aksi?'<div class="go">klik untuk buka →</div>':'')+'</div>';
const wlink=w=>'<span class="w" onclick="event.stopPropagation();bukaWilayah(\''+w.kode+'\')">'+esc(w.nama)+'</span>';
const ztag=z=>'<span class="tag '+zcls(z)+'" onclick="event.stopPropagation();go(\'wilayah\',{filter:{zona:\''+z+'\'}})">'+esc(z.split(' —')[0])+'</span>';

/* ================= RINGKAS ================= */
function vRingkas(){const r=D.ringkas,menang=r.gap<=0;
 document.getElementById('v-ringkas').innerHTML=
 '<div class="grid g4">'+
  kpi('Proyeksi suara kita',n0(r.proyeksi_kita),pp(r.persen_kita)+' suara sah · turnout '+pc(r.turnout),menang?'up':'wrn',"go('wilayah')")+
  kpi('Target menang',n0(r.target),'lawan terkuat '+esc(r.lawan_terkuat||'—')+' · margin aman '+pc(D.konfigurasi.margin_aman),'',"go('target')")+
  kpi(menang?'Surplus':'Kekurangan suara',n0(Math.abs(r.gap)),menang?'unggul '+pp(r.margin_share)+' poin':'butuh '+pp(-r.margin_share)+' poin',menang?'up':'dn',"go('target')")+
  kpi('Peluang menang',r.peluang_menang==null?'data kurang':pp(r.peluang_menang),
      r.peluang_menang==null?'kelengkapan data di bawah batas — klik untuk isi data':'±'+pp(r.sd_total)+' simpangan (n='+n0(r.n_sampel_total)+')',
      r.peluang_menang==null?'wrn':(r.peluang_menang>60?'up':'dn'),r.peluang_menang==null?"go('data')":"go('simulasi')")+
 '</div><div class="grid g4" style="margin-top:12px">'+
  kpi('DPT',n0(r.dpt),n0(r.tps)+' TPS · '+n0(D.konfigurasi.maks_pemilih_per_tps)+' pemilih/TPS','',"bukaTabel('wilayah.csv')")+
  kpi('Saksi TPS',pc(D.saksi.cakupan),n0(D.saksi.kurang)+' kurang · '+rp(D.saksi.biaya_kurang),D.saksi.cakupan>=.9?'up':'wrn',"go('saksi')")+
  kpi('Biaya per suara',rp(D.anggaran.biaya_per_suara),'realisasi '+rp(D.anggaran.realisasi),'',"go('anggaran')")+
  kpi('Drone',n0(D.drone.sortie)+' sortie',D.drone.hari+' hari · '+n1(D.drone.total_target_km2)+' km² · '+rp(D.drone.biaya),'',"go('drone')")+
 '</div><div class="grid g21" style="margin-top:12px">'+
 '<div class="card"><h3>Peta kekuatan — klik wilayah untuk membuka & mengubah</h3><canvas id="cv" height="430"></canvas>'+
  '<div class="legend"><span onclick="go(\'peta\')"><i style="background:#ef4444"></i>lemah</span>'+
  '<span onclick="go(\'peta\')"><i style="background:#f59e0b"></i>sedang</span>'+
  '<span onclick="go(\'peta\')"><i style="background:#22c55e"></i>kuat</span>'+
  '<span onclick="bukaWilayah()">+ tambah wilayah</span></div></div><div>'+
 '<div class="card"><h3>Proyeksi antar kandidat — klik untuk ubah</h3>'+
  D.kandidat.map(k=>'<div class="row klik" onclick="bukaTabel(\'kandidat.csv\')"><span>'+(k.nomor==K()?'★ ':'')+esc(k.nama)+
   '<span class="sub"> · '+esc(k.koalisi.replace(/\|/g,'+'))+'</span></span><b>'+n0(k.proyeksi)+' <span class="sub">'+pp(k.persen)+'</span></b></div>').join('')+
  '<div class="mini">Proyeksi = DPT × turnout '+pc(r.turnout)+' × 97% sah × share. Share = survei (60%) + basis koalisi terkalibrasi k='+n1(r.kalibrasi_k)+' (25%) + door-to-door (15%); bobot dinormalkan pada data yang ada.</div></div>'+
 '<div class="card" style="margin-top:12px"><h3>5 wilayah paling menentukan</h3>'+
  [...D.wilayah].sort((a,b)=>b.dpt*(1-(b.ikc||0)/100)-a.dpt*(1-(a.ikc||0)/100)).slice(0,5)
   .map(w=>'<div class="row klik" onclick="bukaWilayah(\''+w.kode+'\')"><span>'+wlink(w)+' '+ztag(w.zona)+
    '</span><b>'+n0(w.dpt)+' <span class="sub">IKC '+n1(w.ikc)+'</span></b></div>').join('')+
  '<div class="mini">Potensi belum tergarap = DPT × (100 − IKC)/100.</div></div></div></div>'}

/* ================= PETA ================= */
function vPeta(){document.getElementById('v-peta').innerHTML=
 '<div class="grid g21"><div class="card"><h3 style="display:flex;gap:10px;align-items:center">Peta operasi'+
 '<select id="layer" onchange="LAYER=this.value;peta()" style="margin-left:auto">'+
 ['ikc|Kekuatan (IKC)','zona|Zona prioritas','dpt|Kepadatan pemilih','saksi|Cakupan saksi','gap|Defisit suara','drone|Jalur terbang drone']
 .map(o=>'<option value="'+o.split('|')[0]+'"'+(LAYER===o.split('|')[0]?' selected':'')+'>'+o.split('|')[1]+'</option>').join('')+
 '</select><button class="gh" style="margin-left:8px" onclick="bukaWilayah()">+ wilayah</button></h3>'+
 '<canvas id="cv2" height="560"></canvas><div class="legend" id="lg2"></div></div>'+
 '<div class="card"><h3>Detail wilayah</h3><div id="detail" class="sub">Klik titik pada peta — atau <span class="w" onclick="bukaWilayah()">tambah wilayah baru</span>.</div></div></div>'}
function proj(w,W,H){const my=v=>Math.log(Math.tan(Math.PI/4+v*Math.PI/360))*180/Math.PI;
 const xs=D.wilayah.map(v=>v.lon),ys=D.wilayah.map(v=>my(v.lat));
 const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
 const pad=46,s=Math.min((W-pad*2)/((x1-x0)||.01),(H-pad*2)/((y1-y0)||.01));
 return[pad+(w.lon-x0)*s+(W-pad*2-(x1-x0)*s)/2,H-pad-((my(w.lat)-y0)*s)-(H-pad*2-(y1-y0)*s)/2,s]}
function peta(){if(!D)return;[['cv','ikc'],['cv2',LAYER],['cv3','drone']].forEach(([id,ly])=>{
 const c=document.getElementById(id);if(!c||!c.offsetWidth)return;
 const dpr=devicePixelRatio||1,W=c.offsetWidth,H=+(c.dataset.h||(c.dataset.h=c.getAttribute('height')));

 '</tbody></table></div><div class="card" style="margin-top:12px"><h3>Isu per wilayah — klik baris untuk ubah</h3>'+

 D.wilayah.map(w=>'<tr class="klik" onclick="bukaWilayah(\''+w.kode+'\',\'isu\')"><td>'+wlink(w)+'</td>'+

  '<td class="num">'+n1(w.ikc)+'</td></tr>').join('')+'</tbody></table></div>'}

/* ================= SIMULASI ================= */
const sl=(id,lab,mn,mx,val,unit)=>'<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between">'+
 '<span class="sub">'+lab+'</span><b id="'+id+'v">'+n1(val)+unit+'</b></div>'+
 '<input type="range" id="'+id+'" min="'+mn+'" max="'+mx+'" step="0.5" value="'+val+'" oninput="document.getElementById(\''+id+'v\').textContent=this.value+\''+unit+'\';sim()"></div>';
function vSimulasi(){const r=D.ringkas;
 document.getElementById('v-simulasi').innerHTML='<div class="grid g21"><div class="card"><h3>Simulasi skenario</h3>'+
 sl('turnout','Turnout',40,95,r.turnout*100,'%')+sl('swingBasis','Kenaikan share zona BASIS',-5,15,0,' poin')+
 sl('swingGarap','Kenaikan share zona GARAP',-5,15,0,' poin')+sl('saksi','Cakupan saksi',0,100,D.saksi.cakupan*100,'%')+
 sl('serangan','Serangan lawan (share turun merata)',0,10,0,' poin')+
 sl('risiko','Risiko suara hilang di TPS tanpa saksi',0,20,D.konfigurasi.risiko_selisih_tanpa_saksi*100,'%')+
 '<button class="gh" onclick="terapkanSimulasi()">Jadikan turnout & risiko ini permanen di konfigurasi</button>'+
 '<div class="mini">Rumus sama dengan mesin. Kolom "Dasar" = proyeksi mesin tanpa potongan risiko, jadi selisihnya adalah harga dari saksi yang belum lengkap.</div></div>'+
 '<div class="card"><h3>Hasil skenario</h3><div id="simOut"></div></div></div>'+
 '<div class="card" style="margin-top:12px"><h3>Dampak per wilayah — klik baris</h3><div id="simTab"></div></div>';sim()}
function sim(){if(!D||!document.getElementById('turnout'))return;const g=id=>+document.getElementById(id).value;
 const to=g('turnout')/100,sb=g('swingBasis')/100,sg=g('swingGarap')/100,sk=g('saksi')/100,at=g('serangan')/100,rk=g('risiko')/100;
 let kita=0,sah=0,lawan={},rows=[];
 D.wilayah.forEach(w=>{const s=w.dpt*to*0.97;sah+=s;
  const bump=w.zona.startsWith('BASIS')?sb:w.zona.startsWith('GARAP')?sg:0;
  const sh=Math.max(0,Math.min(1,(w.share[K()]||0)+bump-at)),v=s*sh;
  const risiko=w.tps*(1-sk)*D.konfigurasi.maks_pemilih_per_tps*to*rk*(w.share[K()]||0);
  const bersih=Math.max(0,v-risiko);kita+=bersih;
  Object.keys(w.proyeksi).forEach(n=>{if(n!==K())lawan[n]=(lawan[n]||0)+s*(w.share[n]||0)});
  rows.push({w,lama:w.proyeksi[K()],baru:bersih,risiko})});
 const lw=Object.entries(lawan).sort((a,b)=>b[1]-a[1])[0]||['—',0];
 const share=kita/sah,shareL=lw[1]/sah,margin=share-shareL,sd=D.ringkas.sd_total/100;
 const p=cdf(margin/(sd*Math.SQRT2)),target=lw[1]*(1+D.konfigurasi.margin_aman),gap=target-kita;
 document.getElementById('simOut').innerHTML=
  [['Suara kita',n0(kita)+' ('+pc(share)+')'],['Lawan terkuat',n0(lw[1])+' ('+pc(shareL)+')'],
   ['Selisih',(margin>0?'+':'')+pp(margin*100)+' poin'],['Target menang',n0(target)],
   [gap>0?'Kekurangan':'Surplus',n0(Math.abs(gap))],
   ['Suara hilang karena TPS tanpa saksi',n0(rows.reduce((a,b)=>a+b.risiko,0))],
   ['Peluang menang',pp(p*100)]].map(x=>'<div class="row"><span class="sub">'+x[0]+'</span><b class="'+(x[0]==='Peluang menang'?(p>.6?'up':'dn'):'')+'">'+x[1]+'</b></div>').join('')+
  '<div class="gauge"><i style="width:'+Math.min(100,p*100)+'%"></i><u style="left:50%"></u></div><div class="sub">garis putih = titik seimbang 50%</div>';
 document.getElementById('simTab').innerHTML='<table><thead><tr><th>Wilayah</th><th>Zona</th><th class="num">Dasar</th><th class="num">Skenario</th><th class="num">Selisih</th><th class="num">Hilang tanpa saksi</th></tr></thead><tbody>'+
 rows.sort((a,b)=>(a.baru-a.lama)-(b.baru-b.lama)).map(x=>'<tr class="klik" onclick="bukaWilayah(\''+x.w.kode+'\')"><td>'+wlink(x.w)+'</td>'+
  '<td>'+ztag(x.w.zona)+'</td><td class="num">'+n0(x.lama)+'</td><td class="num">'+n0(x.baru)+'</td>'+
  '<td class="num '+(x.baru>=x.lama?'up':'dn')+'">'+(x.baru>=x.lama?'+':'')+n0(x.baru-x.lama)+'</td>'+
  '<td class="num dn">'+n0(x.risiko)+'</td></tr>').join('')+'</tbody></table>'}
async function terapkanSimulasi(){const g=id=>+document.getElementById(id).value;
 const k=await api('/api/konfigurasi');k.turnout_proyeksi=g('turnout')/100;k.risiko_selisih_tanpa_saksi=g('risiko')/100;
 const r=await api('/api/konfigurasi',k);if(r.ok){await muat();toast('Konfigurasi diperbarui & dihitung ulang')}else toast('Gagal',1)}
addEventListener('resize',()=>peta());
