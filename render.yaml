services:
  - type: web
    name: ocklu-pemilu
    runtime: python
    plan: free
    region: singapore
    buildCommand: echo tanpa paket tambahan
    startCommand: python server.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: RENDER
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
